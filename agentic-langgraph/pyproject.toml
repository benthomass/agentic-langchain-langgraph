[project]
name = "agentic-langgraph"
version = "0.1.0"
description = "Project for learning LangGraph and applying it to build AI agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chroma>=0.2.0",
    "grandalf>=0.8",
    "langchain>=0.3.30",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=0.3.86",
    "langchain-google-genai>=3.1.0",
    "langchain-ollama>=0.3.10",
    "langchain-tavily>=0.2.17",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "langgraph>=1.0.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.26",
    "unstructured>=0.24.1",
]
